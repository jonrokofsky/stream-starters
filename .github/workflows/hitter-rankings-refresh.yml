name: Refresh hitter rankings data
on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'
permissions:
  contents: write
concurrency:
  group: hitter-rankings-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check 2026 baseball season
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node - <<'JS'
          const fs = require('fs');
          const today = new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' });
          const run = process.env.EVENT_NAME === 'workflow_dispatch' || (today >= '2026-03-25' && today <= '2026-10-31');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `run=${run}\n`);
          JS
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        if: steps.gate.outputs.run == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.gate.outputs.run == 'true'
      - run: node scripts/refresh-hitter-rankings.mjs
        if: steps.gate.outputs.run == 'true'
      - name: Commit validated snapshot
        if: steps.gate.outputs.run == 'true'
        run: |
          if git diff --quiet -- public/data/hitter-rankings-2026.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/hitter-rankings-2026.json
          git commit -m 'Refresh 2026 hitter rankings snapshot'
          git push origin HEAD:main
